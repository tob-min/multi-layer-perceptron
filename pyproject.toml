[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-layer-perceptron"
version = "0.1.0"
description = "A small educational multilayer perceptron implementation in Python"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib"]

[tool.setuptools]
packages = ["src"]
